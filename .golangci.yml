version: "2"
linters:
  default: none
  enable:
    - dupl
    - errorlint
    - gomodguard_v2
    - govet
    - ineffassign
    - misspell
    - nakedret
    - revive
    - staticcheck
    - unused
  settings:
    dupl:
      threshold: 400
    gomodguard_v2:
      blocked:
        - module: github.com/pkg/errors
          recommendations:
            - errors
            - fmt
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
